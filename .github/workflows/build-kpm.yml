name: Build KPM

on:
  push:
    paths:
      - ".github/workflows/build-kpm.yml"
      - "fgetpriority/**"

  workflow_dispatch:
    inputs:
      release:
        description: 'Push a new release'
        required: false
        default: 'false'
      version:
        description: 'release version'
        required: false
        default: '0.0.4-kpm1'

  pull_request:

env:
  TOOLCHAIN_ARCHIVE: arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf
  TOOLCHAIN_URL: https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
  # Pinned KernelPatch commit this module was last built/verified against.
  KP_REF: 0ceeeb968bef86b48af68640af8b135215dc3399

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: UTC-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Best-effort: works if the repo registered KernelPatch as a real
          # submodule gitlink (`git submodule add`, not just a committed
          # .gitmodules file). The "Fetch KernelPatch" step below is the
          # real source of truth and does not depend on this having worked.
          submodules: 'recursive'
          fetch-depth: 1

      - name: Fetch KernelPatch
        run: |
          set -euo pipefail
          marker="KernelPatch/kernel/linux/include/linux/kernel.h"
          if [ -f "$marker" ]; then
            echo "KernelPatch already present via submodule checkout ($(git -C KernelPatch rev-parse --short HEAD 2>/dev/null || echo unknown))"
          else
            echo "No usable KernelPatch submodule checkout found; cloning KernelPatch@${KP_REF} directly."
            rm -rf KernelPatch
            git clone https://github.com/bmax121/KernelPatch.git KernelPatch
            git -C KernelPatch checkout --quiet "${KP_REF}"
          fi
          test -f "$marker" || { echo "::error::$marker still missing after fetch"; exit 1; }

      - name: Cache aarch64 toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ env.TOOLCHAIN_ARCHIVE }}
          key: toolchain-${{ env.TOOLCHAIN_ARCHIVE }}-v1

      - name: Install bare-metal aarch64 toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o toolchain.tar.xz "${TOOLCHAIN_URL}"
          # fail loudly on a truncated/HTML-error download instead of letting
          # `tar` fail later with a confusing "unexpected end of file"
          tar -tJf toolchain.tar.xz >/dev/null
          tar -xJf toolchain.tar.xz
          rm -f toolchain.tar.xz
          test -x "${TOOLCHAIN_ARCHIVE}/bin/aarch64-none-elf-gcc"

      - name: Build fgetpriority.kpm
        env:
          TARGET_COMPILE: ${{ github.workspace }}/${{ env.TOOLCHAIN_ARCHIVE }}/bin/aarch64-none-elf-
        run: |
          set -euo pipefail
          make -C fgetpriority V=1
          mkdir -p target
          mv fgetpriority/*.kpm target/
          ls -la target/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fgetpriority-kpm
          path: target/*.kpm
          if-no-files-found: error

      - name: Upload release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && success()
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          body: "fgetpriority KPM build, see README.md for compatibility notes."
          artifacts: "target/*.kpm"
          allowUpdates: true
          makeLatest: true
          omitBodyDuringUpdate: true
          replacesArtifacts: true
